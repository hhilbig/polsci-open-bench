experiment_note: Arm B (unconstrained) of the constrained-decoding experiment. The published
  benchmark gave API models server-side JSON-schema enforcement and local Ollama models nothing,
  so the local-versus-API gap confounds model quality with harness parity. These two configs
  are byte-identical except for generation.structured_outputs and run_id, so the difference
  between them isolates the effect of constrained decoding with model, GPU, prompt, items
  and seed all held fixed. Score both arms with code/scoring.py, not with the runner's own
  task_metrics_frame, which uses a different malformed-output convention. The parse-error
  rate of the unconstrained arm is a primary outcome, not a nuisance, so maximum_parse_error_increase
  is deliberately not binding.
