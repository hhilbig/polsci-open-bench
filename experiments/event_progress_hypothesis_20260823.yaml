schema_version: 1
frozen_at: "2026-08-23"
hypothesis: >-
  Later open checkpoints improve event-presence and event-type coding more than
  non-event social-science coding tasks.
primary_contrast: event_tasks_minus_all_other_tasks
discovery_rule:
  event_task: >-
    The gold label identifies whether a described event occurred or assigns an
    event to a type based on observable actions. Topic, stance, sentiment,
    relevance, causal-relation, and tone labels are excluded.
  model_comparison: qwen3_6_27b_fp8_minus_llama3_1_70b_fp8
uncertainty_unit: dataset_source_family
external_inclusion:
  - public item-level text and gold labels
  - explicit event-presence or event-type outcome
  - no source overlap with the existing 34-task repository
  - fixed test split or deterministic sample available
  - license permits non-commercial research evaluation
