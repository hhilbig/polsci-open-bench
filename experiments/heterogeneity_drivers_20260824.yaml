hypotheses:
  - id: H1_decision_space
    status: testable
    moderator: log_effective_label_count
    direction: positive
    claim: >-
      Later-model gains are larger for tasks with a larger effective decision
      space.
    primary_test: >-
      Source-equal permutation test across the 13 Broad18 source families,
      using task-specific F1-points-per-year slopes across all 21 checkpoints.
    sensitivity_tests:
      - Qwen3.6-minus-Llama3.1 endpoint association across all 34 tasks
      - Separate Broad18 and held-out-16 rank associations
      - Comparable dense Qwen and Llama lineage slopes
      - Leave-one-source-out slope range

  - id: H2_calibration
    status: testable
    moderator: binary_output_format
    direction: lower_positive_rate_for_qwen3_6
    claim: >-
      Qwen3.6's relative losses on binary tasks partly reflect a more
      conservative positive-class threshold rather than uniformly worse
      discrimination.
    tests:
      - Sign test for the direction of task-level positive-rate changes
      - Task-level precision and recall changes
      - Binary-versus-nonbinary endpoint contrast under headline F1
      - The same contrast after symmetric macro-F1 rescoring

  - id: H3_gold_determinacy
    status: not_testable
    moderator: comparable_human_vote_entropy_or_agreement
    direction: negative
    reason: >-
      Broad18 does not retain comparable human vote distributions or agreement
      statistics for enough tasks.

  - id: H4_inferential_depth
    status: not_testable
    moderator: blinded_manifest_semantic_pragmatic_rating
    direction: conditional_on_context_sufficiency
    reason: >-
      No outcome-blind independent ratings exist. The current analyst has seen
      the task results and must not supply the ratings retrospectively.

