prompt_file: ../prompts/rivlin_angert_pdd_delegitimization.txt
label_kind: binary
label_key: delegitimization
labels:
  - delegitimization
id:
  kind: column
  column: source_id
text:
  template: |
    Sentence (Hebrew):
    {text}
ground_truth:
  column: gt_delegitimization
