  - Civil Rights
  - Health
  - Agriculture
  - Labor
  - Education
  - Environment
  - Energy
  - Immigration
  - Transportation
  - Law and Crime
  - Social Welfare
  - Housing
  - Domestic Commerce
  - Defense
  - Technology
  - Foreign Trade
  - International Affairs
  - Government Operations
  - Public Lands
  - Culture
id:
