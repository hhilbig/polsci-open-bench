order: 5
name: ornstein_scotus_sentiment
version: 2
supersedes: ../tasks/ornstein_scotus_sentiment.yaml
family: Sentiment / Stance / Tone
source: Ornstein et al. 2025
# Built by code/build_ornstein_scotus_sentiment_task.py from the promptr
# package's scotus_tweets data. The authors coded each tweet's sentiment, not
# sentiment toward the ruling, and their pre-registered prompts (PSRM Table A3)
# ask "whether its sentiment is Positive, Neutral, or Negative". The v2 prompt
# reproduces those prompts, including their 12 few-shot examples, so the v2
# data file drops those 12 tweets (945 -> 933). `case` records which ruling a
# tweet was collected after, not what the tweet is about.
data_file: ../data/ornstein_scotus_v2.csv
prompt_file: ../prompts_v2/ornstein_scotus_sentiment.txt
label_kind: categorical
label_key: sentiment
labels:
  - Positive
  - Negative
  - Neutral
id:
  kind: column
  column: tweet_id
text:
  template: |
    Case: {case}
    Tweet: {text}
ground_truth:
  column: gt_sentiment
