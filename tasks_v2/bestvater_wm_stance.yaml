order: 23
name: bestvater_wm_stance
version: 2
supersedes: ../tasks/bestvater_wm_stance.yaml
family: Sentiment / Stance / Tone
source: Bestvater and Monroe 2023
data_file: ../data/bestvater_wm_stance_v2.csv
prompt_file: ../prompts_v2/bestvater_wm_stance.txt
label_kind: binary
label_key: pro_womens_march
labels:
  - pro_womens_march
id:
  kind: column
  column: source_id
text:
  template: |
    Tweet:
    {text}
ground_truth:
  # v1 used all 19,516 cleaned rows of WM_tweets_groundtruth, of which 87%
  # are approving, so always predicting 1 beat every model. v2 keeps the
  # authors' class-balanced training set (balanced_train == 1, built by random
  # undersampling; it holds every opposing tweet), read from the original CSV
  # upload rather than the Dataverse .tab export, which broke multiline tweets.
  # Built by code/build_bestvater_wm_stance_task.py --version 2.
  column: gt_pro_womens_march
