order: 2
name: ballard_incivility
version: 2
supersedes: ../tasks/ballard_incivility.yaml
family: Relevance / Incivility
source: Ballard 2022
data_file: ../data/ballard_incivility_v2.csv
prompt_file: ../prompts_v2/ballard_incivility.txt
label_kind: binary
label_key: uncivil
labels:
  - uncivil
id:
  kind: column
  column: source_id
text:
  template: |
    Tweet: {text}
ground_truth:
  column: gt_uncivil
# v2 changes both prompt and data, so it is NOT item-paired with v1.
# Prompt: removes the v1 claim that every tweet was "pre-filtered as
# divisive", the "merely divisive/partisan" wording, and the provenance note
# that v1 sent to the model. The incivility definition is the v1 derived one:
# the authors' codebook is not public (the LSQ and APR articles are
# paywalled; the LSQ supporting information has only inter-rater statistics).
# Data (code/build_ballard_incivility_task.py --version 2, from Dataverse
# doi:10.7910/DVN/2ET6VL training_final): HTML entities unescaped, mojibake
# and doubled quotes repaired, 307 truncated retweets dropped, 125 duplicate
# copies of tweets dropped (20 of them with conflicting labels);
# 2682 -> 2250 rows. source_id is the source file's row id; real tweet ids are
# not recoverable from the source.
