order: 8
name: halterman_keith_bfrs
version: 2
supersedes: ../tasks/halterman_keith_bfrs.yaml
family: Event coding
source: Halterman and Keith 2026
data_file: ../data/halterman_keith_bfrs.csv
prompt_file: ../prompts_v2/halterman_keith_bfrs.txt
label_kind: categorical
label_key: event_type
labels:
  - ASSASSINATION
  - DRONE_ASSASSINATION
  - ATTACK_ON_STATE
  - CONVENTIONAL_ATTACK_ON_GOV_FORCES
  - GUERILLA_ATTACK_ON_GOV_FORCES
  - GOV_ATTACK_ON_NONSTATE_COMBATANTS
  - GOV_ATTACK_ON_CIVILIANS
  - RIOT
  - TERRORISM
  - THREAT_OF_VIOLENCE
  - VIOLENT_POLITICAL_DEMONSTRATION
  - OTHER
id:
  kind: generated
  prefix: halterman_keith_bfrs
text:
  template: |
    News story from Pakistan:
    {text}
ground_truth:
  column: gt_event_type
# ASSASSINATION stays a label the model can choose and its items stay in the
# sample, but it is left out of the headline macro average (decision
# 2026-11-14). Gold codes domestic and honour killings as ASSASSINATION, while
# the codebook shown to the model gives such a killing as its OTHER example
# (9 of 31 sampled ASSASSINATION items in the Nov 2026 audit). The original
# BFRS codebook is not public, so the conflict cannot be resolved from source.
headline_exclude_labels:
  - ASSASSINATION
# v2 changes the prompt and the headline class set: the source codebook's contradictory
# "Output Reminder" line was removed, and a stray '""",' left from the source
# Python string after the ASSASSINATION negative clarification was deleted. Same data, same sampling, so this
# task IS item-paired with v1.
