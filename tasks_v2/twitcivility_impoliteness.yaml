# v2 changes the prompt only (same data, same sampling), so this task IS
# item-paired with v1. The impoliteness and intolerance definitions and the
# per-class examples are quoted from Pendzel et al. (2023, arXiv:2305.14964,
# Section 1 and Table 1, the examples shown to annotators). The annotators'
# codebook itself is not public. The v1 prompt did not mention that
# intolerance was coded as a separate dimension; 1,977 of the 9,554 gold-0
# rows are labeled intolerant in the source.
