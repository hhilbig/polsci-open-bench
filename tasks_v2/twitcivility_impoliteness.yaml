order: 22
name: twitcivility_impoliteness
version: 2
supersedes: ../tasks/twitcivility_impoliteness.yaml
family: Relevance / Incivility
source: Pendzel et al. 2023
data_file: ../data/twitcivility_impoliteness.csv
prompt_file: ../prompts_v2/twitcivility_impoliteness.txt
label_kind: binary
label_key: impolite
labels:
  - impolite
id:
  kind: column
