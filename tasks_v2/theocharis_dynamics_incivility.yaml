# v2 changes both prompt and data, so it is NOT item-paired with v1.
# Prompt: the two category definitions, examples and coder note are quoted
# from the coding scheme in Theocharis et al. (2020, Sage Open). The v1 prompt
# said sarcasm was not uncivil; the source scheme lists sarcasm and ALL CAPS
# as uncivil.
# Data (code/build_theocharis_dynamics_incivility_task.py --version 2): tweet
# ids read as strings (v1 stored floats); HTML entities unescaped; 261 source
