order: 31
name: politicause_causal_relation
version: 2
supersedes: ../tasks/politicause_causal_relation.yaml
family: Causal relation detection
source: Garcia Corral et al. 2024
data_file: ../data/politicause_causal_relation.csv
prompt_file: ../prompts_v2/politicause_causal_relation.txt
label_kind: binary
label_key: causal_relation
labels:
  - causal_relation
id:
  kind: column
  column: source_id
text:
  template: |
    Sentence:
    {text}
ground_truth:
  column: gt_causal_relation
# v2 changes the prompt only (same data, same sampling), so this task IS
# item-paired with v1. The definition, step 1, the extended guidelines and the
# four examples are quoted from the annotation scheme in Garcia Corral et al.
# (2024, LREC-COLING, Section 3). The v1 prompt counted causal relations that
# a sentence "clearly implies"; the source scheme requires them to be explicit
# and complete within the sentence.
