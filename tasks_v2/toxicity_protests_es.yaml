# v2 changes the prompt only (same data, same sampling), so this task IS
# item-paired with v1. The second paragraph of the prompt is the Spanish
# question the human coders answered in Labelbox, copied verbatim from the
# classification name in the project's Labelbox export
# (training-datalab/gold-standard-toxicity,
# data/tidy/gold-standard-toxicity-9_6_2024.ndjson). It is the Spanish form of
# the Perspective API toxicity definition quoted in arXiv:2409.09741. The v1
# prompt asked for insulting or abusive wording instead.
