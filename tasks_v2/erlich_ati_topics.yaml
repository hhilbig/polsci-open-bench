order: 24
name: erlich_ati_topics
version: 2
supersedes: ../tasks/erlich_ati_topics.yaml
family: Policy-topic coding
source: Erlich et al. 2022
data_file: ../data/erlich_ati_topics.csv
prompt_file: ../prompts_v2/erlich_ati_topics.txt
label_kind: multi_binary
# `Other` (S8_dummy_Other) is dropped. Rule: a multi-binary label is dropped
# when its prevalence in the task pool is below 2%, i.e. fewer than two expected
# positives in a 100-item scored sample. `Other` is 72 of 4,751 rows (1.5%);
# the next rarest label, Regulatory, is 9.9%. It is also a residual category
# ("theme did not fall into the above themes"). Items are unchanged; the 33
# requests coded only `Other` now have all six labels 0.
labels:
  - Activities
  - Budget
  - Evaluation
  - External Contracts
  - Institutional Structure
  - Regulatory
id:
  kind: column
  column: source_id
text:
  template: |
    Access-to-information request:
    {text}
ground_truth:
  columns:
    Activities: gt_Activities
    Budget: gt_Budget
    Evaluation: gt_Evaluation
    External Contracts: gt_External Contracts
    Institutional Structure: gt_Institutional Structure
    Regulatory: gt_Regulatory
