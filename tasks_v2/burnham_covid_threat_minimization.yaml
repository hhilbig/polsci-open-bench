order: 28
name: burnham_covid_threat_minimization
version: 2
supersedes: ../tasks/burnham_covid_threat_minimization.yaml
family: Sentiment / Stance / Tone
source: Burnham 2025
data_file: ../data/burnham_covid_threat_minimization_v2.csv
prompt_file: ../prompts_v2/burnham_covid_threat_minimization.txt
label_kind: binary
label_key: threat_minimizing
labels:
  - threat_minimizing
id:
  kind: column
  column: source_id
text:
  template: |
    Tweet:
    {text}
ground_truth:
  # v1 scored against `threatmin`, which is the prediction of Burnham's first
  # NLI hypothesis set, not a human code (sect_4_analysis.R compares
  # `non_comp`, "original labels", against `threatmin`). v1 was also built
  # from the Dataverse-ingested .tab export, which splits multiline tweets
  # into extra rows. v2 uses the human Block et al. (2022) label `non_comp`
  # from the original 300-row CSV upload. Built by
  # code/build_burnham_covid_threat_minimization_task.py --version 2.
  column: gt_threat_minimizing
