# Copy of tasks_ext/benoit_manifesto_social_position.yaml whose prompt also tells the model to ignore
# party and politician names; built by code/build_ignore_names_tasks.py.
order: 237
name: benoit_manifesto_social_position_ignore
family: Ideological position
source: Benoit et al. 2016
data_file: ../data/benoit_manifesto_social_position.csv
prompt_file: ../prompts/benoit_manifesto_social_position_ignore.txt
label_kind: categorical
ordinal: true
label_key: social_position
